name = "water-fills"
main = "worker/build/worker/shim.mjs"
compatibility_date = "2026-09-01"

[build]
command = "cd worker && worker-build --release"
watch_dir = ["worker/src", "shared/src"]

[assets]
directory = "target/dx/frontend/release/web/public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "water-fills"
# Replace with the id printed by `npx wrangler d1 create water-fills`.
# Local dev (`wrangler dev`) works with any placeholder value.
database_id = "a119d905-6814-4f3d-bf47-bc342f74b0e6"
migrations_dir = "worker/migrations"
