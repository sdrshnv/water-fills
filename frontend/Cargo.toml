[package]
name = "frontend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Pinned to match the installed `dx` CLI (it refuses mismatched versions).
dioxus = { version = "=0.7.6", features = ["web"] }
shared = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
gloo-net = { version = "0.7", features = ["http"] }
gloo-storage = "0.4"
gloo-events = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
